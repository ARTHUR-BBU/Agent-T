<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>合同审查</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Screen 1: Upload -->
    <section id="screen-upload" class="screen">
      <header class="top">
        <h1>上传合同</h1>
        <p class="sub">拖入 PDF 或 Word，或点此选择</p>
      </header>
      <div class="card empty-state" id="empty-hint">
        <p class="muted">还没有文件</p>
      </div>
      <div class="card">
        <label class="field">
          <span>合同类型</span>
          <select id="category">
            <option value="procurement">采购合同</option>
            <option value="nda">保密协议（NDA）</option>
          </select>
        </label>
        <label class="field file-field">
          <span>选择文件</span>
          <input type="file" id="file" accept=".txt,.md,.pdf,.docx,.doc,text/plain" />
        </label>
        <button id="btn-upload" class="primary" type="button">开始审查</button>
        <p id="upload-error" class="error hidden"></p>
      </div>
    </section>

    <!-- Screen 2: Results -->
    <section id="screen-results" class="screen hidden">
      <header class="top">
        <button type="button" class="link" id="btn-back-upload">← 重新上传</button>
        <h1>审查结果</h1>
      </header>
      <div id="results-loading" class="card">
        <p class="muted">正在审查…</p>
      </div>
      <div id="results-error" class="card error hidden"></div>
      <div id="results-body" class="hidden">
        <div class="meta card" id="results-meta"></div>
        <!-- M3.5 评分卡：参考层（灰底、无彩色），规则清单仍是唯一权威层 -->
        <div class="card score-card hidden" id="score-card">
          <div class="score-head">
            <span class="score-value"><span id="score-total">–</span><span class="score-unit">/100</span></span>
            <span class="score-grade" id="score-grade"></span>
          </div>
          <p class="score-summary" id="score-summary"></p>
          <p class="score-caps hidden" id="score-caps"></p>
          <p class="score-disclaimer" id="score-disclaimer">模型评分仅供参考，以逐条规则结论为准</p>
          <details class="score-details">
            <summary>分段明细</summary>
            <ul class="score-breakdown" id="score-breakdown"></ul>
          </details>
        </div>
        <div class="legend card">
          <span class="tag pass">通过</span>
          <span class="tag attention">需关注</span>
          <span class="tag notfound">未找到</span>
          <span class="tag na">不适用</span>
        </div>
        <ul id="item-list" class="item-list"></ul>
        <!-- Detail panel: 原文摘句 when a row is selected -->
        <div id="item-detail" class="item-detail hidden" aria-live="polite">
          <p class="detail-label">说明</p>
          <p id="detail-note" class="detail-note"></p>
          <p class="detail-label">原文</p>
          <div id="detail-quote" class="detail-quote"></div>
          <div id="detail-actions" class="detail-actions hidden">
            <button type="button" class="link ask-link" id="detail-ask">问清楚一点 →</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Screen 3: Ask -->
    <section id="screen-ask" class="screen hidden">
      <header class="top">
        <button type="button" class="link" id="btn-back-results">← 返回结果</button>
        <h1>问清楚一点</h1>
        <p class="sub">对「需关注」点开，用人话解释或给改法</p>
        <p class="sub" id="ask-subtitle"></p>
      </header>
      <!-- Fixed top trust card -->
      <div class="card quote-card" id="ask-quote-card">
        <p class="quote-title">原文</p>
        <div id="ask-quote" class="quote-body"></div>
      </div>
      <div class="card">
        <p id="ask-unavailable" class="muted hidden">追问暂未开通</p>
        <div id="ask-context" class="ask-context"></div>
        <textarea id="ask-input" rows="3" placeholder="例如：违约金风险大吗？"></textarea>
        <button id="btn-ask" class="primary" type="button">发送</button>
        <p id="ask-error" class="error hidden"></p>
        <div id="ask-answer" class="answer hidden">
          <p class="detail-label">人话解释</p>
          <div id="ask-explain" class="detail-note"></div>
          <p class="detail-label">建议改法</p>
          <div id="ask-rewrite" class="detail-note"></div>
        </div>
      </div>
    </section>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
