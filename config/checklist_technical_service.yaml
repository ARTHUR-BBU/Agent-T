# 技术服务品类审查清单（B2-1 品类骨架）
# 设计稿：docs/spec-b2-technical-service.md v1.1.1（外审复批通过）
# 法务依据：老钱 13 项设计稿（2026-10-09）+保密三裁（2026-10-10）+金标 v2.1
# 收录边界：技术开发/技术服务/软件外包/系统集成运维；拒收咨询/劳务派遣/技术转让（分诊台）
# v1.1.1：subtype=unknown 阶段，termination/ip 只给中性说明；功能开关隐藏（B2-2 金标锁定后开放）
category: technical_service
label: 技术服务
# 功能开关（v1.1.1 外审复批）：B2-1 注册配置与测试入口就位但用户不可见；
# B2-2 金标锁定后移除本开关开放 UI 与分诊（先盖好房子再开门）
hidden: true
version: 1

scorecard:
  segments:
    - key: A
      name: 主体资格
      weight: 10
    - key: B
      name: 核心内容（做什么、交付什么、何时完成）
      weight: 22
    - key: C
      name: 价款与支付（钱怎么付、留不留后手）
      weight: 14
    - key: D
      name: 验收、违约与退出（怎么算合格、违约怎么赔、怎么收场）
      weight: 20
    - key: E
      name: 公平性与权利归属（有没有一边倒、成果归谁）
      weight: 18
    - key: F
      name: 争议与法律适用
      weight: 8
    - key: G
      name: 程序与形式
      weight: 8

items:
  # ============ A 段 ============
  - id: subject
    class: existence
    name: 主体
    segment: A
    description: 合同主体是否完整、清晰（名称、角色、授权等）
    pass_fulltext_fallback: true
    rules:
      need_attention:
        - any_of:
            - "有限公司|股份有限公司|有限责任公司"
            - "甲方|乙方|委托方|受托方|发包方|承包方"
          note: 仅见公司名称，未见法定代表人、住所或统一社会信用代码等完整主体信息
          class: existence
          unless:
            any_of:
              - "法定代表人"
              - "统一社会信用代码"
              - "住所[:：]"
              - "注册地址"
              - "经营场所"
      pass:
        - any_of:
            - "法定代表人"
            - "统一社会信用代码"
            - "住所[:：]|注册地址"
      not_found:
        - pattern: "甲方|乙方|委托方|受托方|发包方|承包方"

  # ============ B 段 ============
  - id: service_scope
    class: heuristic
    name: 服务内容与交付物
    segment: B
    description: 工作内容/功能范围/交付物是否实质可识别（「详见附件」悬空=范围悬置）
    rules:
      need_attention:
        # 范围笼统词（外部化标准）
        - any_of:
            - "按乙方标准"
            - "按实际情况确定"
            - "视项目进展"
            - "双方另行协商确定.{0,6}服务内容"
            - "以乙方实际交付为准"
          note: 服务内容仅见笼统/外部化表述，范围实质不可识别
          class: heuristic
        # 源码交付缺失（偏向委托方注记；受托方立场属正当商业保护，不设 hardline）
        - pattern: "不交付源代码|仅交付目标程序|不提供源码"
          class: heuristic
          note: 约定不交付源代码——委托方二次开发与自主运维被锁死；受托方视角属正当商业保护，请按自身立场评估
      pass:
        # 功能词∧交付物词同分句（实质锚定）
        - pattern: "(?:功能需求|功能模块|需求规格|功能清单|工作内容|服务内容)[^。\\n\\r]{0,40}(?:交付物|交付清单|交付成果|源代码|源程序|技术文档)|(?:交付物|交付清单|源代码|源程序|技术文档)[^。\\n\\r]{0,40}(?:功能需求|功能模块|需求规格|工作内容|服务内容)"
          class: heuristic
      not_found:
        - pattern: "服务|开发|实施|维护|技术"

  - id: schedule
    class: existence
    name: 期限与进度
    segment: B
    description: 开发/服务周期与里程碑是否实质锚定（四分类口径，同采购 P2）
    rules:
      need_attention:
        # pending 档（另行协商/待定→需关注）
        - matcher: procurement_term
          require_hit_type: ["pending"]
          class: heuristic
        # 技术特有：单方顺延（偏向委托方）
        - any_of:
            - "乙方有权单方顺延工期"
            - "工期根据实际情况自行调整"
          note: 工期可由受托方单方调整，交付时间实质不受约束
          class: heuristic
      pass:
        # anchored/unlabeled_numeric→通过（P2 四分类口径原样沿用；blank→未找到+旗标由 matcher 产出）
        - matcher: procurement_term
          require_hit_type: ["anchored", "unlabeled_numeric"]
      not_found:
        - pattern: "工期|期限|交付日期|里程碑|开发周期|服务期"

  # ============ C 段 ============
  - id: payment
    name: 价款与支付
    segment: C
    description: 价款构成与付款节奏是否合理
    rules:
      need_attention:
        # 背靠背 hardline（法释〔2024〕11号+《保障中小企业款项支付条例》第2条
        # 明列「服务」在射程内；note 补适用范围限定：针对大型企业与中小企业间
        # 交易，非一切付款安排自动无效——v1.1 外审修订）
        - any_of:
            - "背靠背"
          unless:
            - "不采用[^。]{0,8}背靠背"
            - "未采用[^。]{0,8}背靠背"
            - "不设[^。]{0,6}背靠背"
            - "不适用[^。]{0,6}背靠背"
          class: hardline
          note: 付款以第三方（业主/最终客户等）支付为前提（背靠背条款）。法释〔2024〕11号：大型企业与中小企业约定以第三方支付款项为付款前提的条款无效——注意其适用范围为大型企业与中小企业间的交易；条款无效后按交易习惯确定付款期限。对受托方是现金流风险，对委托方亦属「伪保护」，请结合自身立场评估。
        - any_of:
            - "以[^。，]{0,20}(业主|建设单位|最终客户|第三方(?!支付平台|支付渠道|收款平台)|上游|甲方客户)[^。]{0,60}(支付|付款|回款|拨付|拨款)[^。]{0,12}(前提|条件)"
            - "以[^。，]{0,20}(业主|建设单位|最终客户|第三方(?!支付平台|支付渠道|收款平台)|上游|甲方客户)[^。]{0,60}(回款|拨付|拨款)[^。]{0,12}(为准)"
          class: hardline
          note: 付款以第三方（业主/最终客户等）支付为前提（背靠背条款）。法释〔2024〕11号针对大型企业与中小企业间交易；条款无效后按交易习惯确定付款期限。对受托方是现金流风险，请结合自身立场评估。
        # 技术特有：付款条件可无限不成就（民法典 159 恶意阻止条件成就脉络）
        - any_of:
            - "验收合格后支付.{0,6}(全部|尾款|余款)"
            - "(初验|终验).{0,10}合格后.{0,10}(支付|付款)"
          class: heuristic
          note: 尾款系于验收合格但需确认全文是否另有验收期限与标准——付款条件可无限不成就（民法典159条恶意阻止条件成就脉络）
        # 技术措辞变体簇（外审验收单「换措辞仍命中」）：收到第三方款项后再支付
        - any_of:
            - "(?:收到|待)[^。\\n\\r]{0,25}(?:业主|建设单位|最终客户|第三方(?!支付平台|支付渠道|收款平台)|上游|甲方客户)[^。\\n\\r]{0,30}(?:支付|付款|拨付|回款|结算)[^。\\n\\r]{0,30}(?:后|再|以后)[^。\\n\\r]{0,15}(?:支付|付款|结算)"
            - "(?:业主|建设单位|最终客户|第三方|上游|甲方客户)[^。\\n\\r]{0,12}(?:资金|款项|货款|工程款|进度款|付款)[^。\\n\\r]{0,15}(?:到账|到位)[^。\\n\\r]{0,20}(?:后|再|以后)[^。\\n\\r]{0,15}(?:支付|付款|结算)"
          class: hardline
          note: 付款以第三方（业主/最终客户等）支付为前提（背靠背条款变体）。法释〔2024〕11号针对大型企业与中小企业间交易；对受托方是现金流风险，请结合自身立场评估。
      pass:
        - any_of:
            - "分期支付"
            - "里程碑"
            - "预付款"
            - "进度款"
            - "合同总价"
            - "开发费"
            - "服务费"
      not_found:
        - pattern: "价款|费用|报酬|支付|付款"

  # ============ D 段 ============
  - id: acceptance
    class: heuristic
    name: 验收标准与程序
    segment: D
    description: 验收是否双向公平且实质可执行（本品类纠纷率最高条款）
    missing_as: 需关注
    missing_note: 全文未找到验收安排——技术开发合同核心条款缺失（民法典878条+技术合同司法解释验收规则）
    rules:
      need_attention:
        # hardline：验收单方化（偏向委托方——对方说了算）
        - any_of:
            - "以乙方交付为准"
            - "乙方自行验收"
            - "验收标准由乙方制定"
            - "不得以质量异议拒绝付款"
            - "验收不合格.{0,10}仅负责修复.{0,20}不承担(?:任何)?违约责任"
          class: hardline
          note: 验收单方化——验收实质由受托方说了算，质量异议通道被关闭（红线）
        # hardline：无限验收义务（偏向甲方——需求蔓延/无限返工）
        - any_of:
            - "乙方须无条件通过验收"
            - "免费重新开发直至甲方满意"
            - "以甲方主观评价为准"
          class: hardline
          note: 验收义务无限化——受托方无法预期交付标准（红线）。需求蔓延与无限返工风险，请按自身立场评估
        # heuristic：默认验收（技术合同司法解释「擅自使用视为认可」裁判倾向，对委托方不利）
        - any_of:
            - "上线.{0,6}视为验收合格"
            - "运行.{0,6}视为验收"
            - "使用即视为验收"
            - "收到交付物后[一-龥0-9]{0,2}[1-3][日天].{0,10}未?提出.{0,6}异议.{0,8}视为验收"
          class: heuristic
          note: 默认验收条款——上线/使用即视为验收合格对委托方不利；短异议期（≤3日）难以完成实质测试
        # heuristic：验收义务不对等（偏向受托方）
        - any_of:
            - "免费重新开发"
            - "无限期.{0,4}修改"
            - "直至甲方满意"
          class: heuristic
          note: 验收整改义务无限化，履行边界无法确定（反向红线）
      pass:
        # 实质锚定（P2 教训落地）：pass 不认「验收」裸词——须验收∧实质标准词同句；
        # 「验收合格后付款」属 payment 语义域不构成本项证据
        - pattern: "验收[^。\\n\\r]{0,20}(?:标准|要求|规范|用例)[^。\\n\\r]{0,30}(?:符合|达到|按照|详见)|(?:符合|达到|按照)[^。\\n\\r]{0,12}(?:国家标准|行业标准|技术规范|需求规格|测试用例)[^。\\n\\r]{0,20}验收|(?:功能|性能|技术指标|测试用例|需求规格)[^。\\n\\r]{0,20}验收"
          class: heuristic
        # 验收程序双锚：期限含数字∧书面异议方式
        - pattern: "验收[^。\\n\\r]{0,16}[0-9一二三四五六七八九十]+[日天][^。\\n\\r]{0,20}(?:书面|通知|异议)"
          class: heuristic
      not_found:
        - pattern: "验收|测试|交付确认"

  - id: breach
    name: 违约责任
    segment: D
    description: 违约责任是否对等、可执行
    rules:
      need_attention:
        # F-2 对等豁免门（金标 v2 整簇移植自采购——违约词族通用）
        - hit_alternatives:
            - pattern: "免除违约责任"
              start_token: "免除"
              neg_sensitive: true
            - pattern: "免除.{0,8}违约"
              start_token: "免除"
              neg_sensitive: true
            - pattern: "不承担违约"
              start_token: "不承担违约"
              neg_sensitive: false
            - pattern: "无需承担违约"
              start_token: "无需承担"
              neg_sensitive: false
            - pattern: "放弃追究"
              start_token: "放弃"
              neg_sensitive: true
            - pattern: "放弃.{0,6}追究"
              start_token: "放弃"
              neg_sensitive: true
            - pattern: "豁免违约责任"
              start_token: "豁免"
              neg_sensitive: true
            - pattern: "违约责任由.{0,10}自行承担"
              start_token: "违约责任由"
              neg_sensitive: false
          unless_window: 300
          note: 单方免除违约责任，权利义务严重不对等
          class: hardline
      pass:
        - any_of:
            - "违约金"
            - "赔偿.{0,6}损失"
            - "承担违约责任"
      not_found:
        - pattern: "违约"

  - id: termination
    class: existence
    name: 解除与退出
    segment: D
    description: 退出机制是否约定（v1.1.1：B2-1 subtype=unknown 只给中性说明；857/858 技术开发语境待 subtype 就位）
    missing_as: 需关注
    missing_note: 全文未找到解除/终止/退出机制的约定——合同收场路径悬空
    rules:
      pass:
        - any_of:
            - "解除"
            - "终止"
            - "退出"
      not_found:
        - pattern: "解除|终止|退出"

  # ============ E 段 ============
  - id: ip
    class: existence
    name: 知识产权归属
    segment: E
    description: 成果归属、既有成果边界、使用权/转让权是否明确约定（民法典859-861条，各子场景法定默认不同）
    # v1.1 中性口径：未明确约定→需关注（不用「沉默即失权」——委托开发/合作
    # 开发/技术秘密各有默认规则，B2-1 subtype=unknown 不分述，中性提示）
    missing_as: 需关注
    missing_note: 全文未明确约定成果归属、既有成果边界、使用权/转让权——技术合同成果权属缺约定，各子场景法定默认不同（民法典859-861条），请特别注意
    rules:
      need_attention:
        # hardline：成果全归受托方（偏向委托方）且无对价/背景知产例外
        - pattern: "(?:一切|所有|全部)(?:开发)?成果.{0,8}知识产权.{0,6}归(?:受托方|乙方|开发方)"
          class: hardline
          unless:
            any_of:
              - "背景知识产权"
              - "既有成果"
              - "除.{0,6}外"
          note: 全部成果知识产权归受托方且未见例外安排——委托方付费成果却无权利（红线）
        # hardline：成果全归委托方且吞并既有成果（偏向甲方——通用组件被无偿吞没）
        - pattern: "(?:一切|所有|全部)(?:开发)?成果(?:[^。\\n\\r]{0,12})?均?归(?:委托方|甲方)(?:所有)?[^。\\n\\r]{0,30}(?:含|包括|包含)[^。\\n\\r]{0,6}(?:乙方|受托方|开发方)?(?:既有|已有)"
          class: hardline
          unless:
            any_of:
              - "背景知识产权"
              - "既有成果.{0,10}归"
              - "除.{0,6}外"
          note: 成果归属一刀切归委托方且吞并受托方既有成果，未见例外清单（红线）
        # heuristic：共有但无行使规则（专利法14条脉络，法律有默认兜底故降档）
        - pattern: "共(?:同)?(?:享有|拥有|所有).{0,10}知识产权|知识产权.{0,6}归.{0,4}双方共(?:同|有)"
          class: heuristic
          note: 知识产权约定共有但未见行使/转让规则——共有僵局风险（专利法14条有默认兜底）
      pass:
        # 归属语义域（金标 v2：裸提及不算）——「X归Y所有」形态
        - pattern: "(?:知识产权|著作权|专利(?:申请权)?|技术成果|成果).{0,12}归.{0,8}(?:甲方|乙方|委托方|受托方|双方|各方|分别)|(?:甲方|乙方|委托方|受托方).{0,6}(?:享有|拥有).{0,8}(?:知识产权|著作权|专利)|背景知识产权|既有成果"
          class: heuristic
      not_found:
        - pattern: "知识产权|著作权|专利|成果归属|源码权利"

  - id: unfair_terms
    name: 格式条款/单方不公平
    segment: E
    description: 有无一边倒条款（双向红线：开放性免责↔无限义务）
    rules:
      need_attention:
        # hardline：开放性免责/对价落空/数据免责（偏向委托方）。
        # 「按行业惯例」裸词负向：后跟客观锚点（标准/规范/法规）不拦——
        # 拦的是无锚点的标准外部化（验收单反例「按行业惯例及国家标准执行」）
        - any_of:
            - "按行业惯例(?!(?:及|和|与)?[^。\\n\\r]{0,4}(?:标准|规范|法规)).{0,10}(执行|处理|确定)"
            - "乙方不对.{0,10}(可用性|正确性|准确性).{0,6}作(?:任何)?(?:保证|承诺)"
            - "甲方数据丢失.{0,8}乙方不承担"
            - "不对.{0,6}服务结果.{0,6}(作|做出|作出)(?:任何)?(?:保证|承诺)"
          class: hardline
          note: 开放性免责或对价落空——服务标准外部化或核心对价无保障（民法典497、506条脉络，红线）
        # hardline：无限义务（偏向甲方——履行边界无法确定，反吞噬受托方）
        - any_of:
            - "永久免费维护"
            - "终身免费(?:升级|维护)"
            - "无限期质保"
            - "需求变更.{0,6}无条件纳入"
          class: hardline
          note: 无限义务条款——履行边界无法确定，反吞噬服务方（红线）。请按自身立场评估
      pass:
        - any_of:
            - "双方协商"
            - "另行书面约定"
            - "权利义务对等"
      not_found:
        - pattern: "责任|义务|保证"

  - id: confidentiality
    class: existence
    name: 保密（技术信息与资料）
    segment: E
    description: 保密义务是否实质约定（民法典845条技术合同一般条款；制式文本保密栏四态）
    # 四态 day one 内置（老钱裁定 2026-10-10，5 份官方语料实证）
    # 关键陷阱：制式引导句「…保密义务如下：」含裸词「保密义务」，pass 裸词
    # 须排除空引导形态（F-12「字段名不创设义务」同款教训），否则空白模板被
    # 洗成通过——80% 语料的必然形态
    missing_as: 需关注
    missing_note: 全文未找到保密表述。技术合同一般条款包括保密事项（民法典845条），受托方通常深度接触技术资料、源码、数据，缺口实质性高于一般买卖；确属简单服务的请人工复核
    rules:
      need_attention:
        - pattern: "(?:保密内容|涉密人员范围|保密期限|泄密责任|保密义务)(?:（[^）]{0,20}）)?(?:[:：][ \\t]*|\\t)(?:另行协商|待定|协商确定|双方另行商定)"
          class: heuristic
          note: 保密栏已填写但为悬置表述，保密义务实质未约定
        - pattern: "(?:保密内容|涉密人员范围|保密期限|泄密责任)(?:（[^）]{0,20}）)?(?:[:：][ \\t]*|\\t)(?:无|均无|没有|不涉及|不作约定|无特殊约定)|保密义务(?:如下)?[:：][ \\t]*无|无需保密|不涉及保密|无保密要求"
          class: heuristic
          note: 保密栏明确填写「无」等否认内容，双方明示不设保密义务。民法典501条法定兜底远窄于约定保护；技术服务受托方通常接触技术资料、源码、数据，风险尤高
      pass:
        - any_of:
            - "商业秘密"
            - "不得披露"
            # 裸词排除空引导形态（空白制式模板的「保密义务如下：」不创设义务）
            - "保密义务(?!如下[:：][ \\t]*(?=\\n|\\r|$))"
            # 制式子项标签+实质内容（冒号同格/表格跨格 tab；负向护栏=否认簇）
            - "(?:保密内容|涉密人员范围|保密期限|泄密责任)(?:（[^）]{0,20}）)?(?:[:：][ \\t]*|\\t)(?!另行协商|待定|协商确定|双方另行商定|无|均无|没有|不涉及|不作)(?=[^\\s。；;\\n\\r\\t])[^。\\n\\r\\t;；]{2,}"
          # 留白旗标（引擎消费在 pass 规则级——三品类统一口径，勿放 rules 级）
          blank_flag_pattern: "(?:保密内容|涉密人员范围|保密期限|泄密责任)(?:（[^）]{0,20}）)?[:：][ \\t]*(?=$|[。；;\\n\\r])|(?:保密内容|涉密人员范围|保密期限|泄密责任)(?:（[^）]{0,20}）)?[ \\t]*(?=\\n|$)|(?:保密内容|涉密人员范围|保密期限|泄密责任)\\t(?=\\t|\\n|$)"
          blank_flag_note: "检测到保密栏目但内容空白。"
      not_found:
        - pattern: "保密"

  # ============ F 段 ============
  - id: jurisdiction
    class: existence
    name: 管辖与争议解决
    segment: F
    description: 争议解决方式是否约定
    rules:
      pass:
        - any_of:
            - "仲裁"
            - "人民法院"
            - "管辖"
            - "协商解决"
      not_found:
        - pattern: "争议|纠纷|仲裁|诉讼"

  - id: governing_law
    class: existence
    name: 适用法律（按哪国/哪地法律）
    segment: F
    description: 是否明确适用法律（仅有管辖无适用法律 → 需关注）
    missing_as: 需关注
    missing_note: 全文检索未找到适用法律条款（未写明适用哪国/哪地法律）；仅有管辖约定不够
    rules:
      pass:
        - any_of:
            - "适用.{0,10}法律"
            - "适用中华人民共和国"
            - "受中华人民共和国法律"
      not_found:
        - pattern: "法律"

  # ============ G 段 ============
  - id: signature
    class: existence
    name: 签署与印章
    segment: G
    description: 签署方式是否完整（签字+盖章）
    rules:
      need_attention:
        # F-4 等价组（移植自采购）：仅盖章栏无签字栏→需关注；正文「签字盖章后生效」不阻止
        - any_of:
            - "（盖章）|\\(盖章\\)"
            - "加盖公章|盖章确认|仅盖章"
            - "盖章[:：]"
            - "仅加盖单位印章"
            - "公章处[:：]?"
            - "加盖单位公章即可"
            - "单位公章[:：]"
          note: 仅见盖章栏，未见签字栏或授权代表签署，签署要件不完整
          class: existence
          unless:
            any_of:
              - "（签字|\\(签字"
              - "签字.{0,6}盖章"
              - "法定代表人.{0,12}(签|盖章)"
              - "授权代表"
              - "委托代理人|委托代表"
              - "签字或盖章"
      pass:
        - any_of:
            - "（签字|\\(签字"
            - "法定代表人[^。\\n\\r]{0,12}(签|盖章)"
            - "授权代表"
            - "委托代理人|委托代表"
            - "签字或盖章"
      not_found:
        - pattern: "盖章|签字|签章"
