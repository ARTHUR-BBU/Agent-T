# 采购合同审查清单（12 项）
# 规则优先用 any_of 同义/近义组，避免单点关键词脆弱匹配
# 立场元数据（阶段 1.3，法务老钱裁决书）：立场=声明+防错配，不改规则词表。
# 老钱矩阵：采购仅单一视角可审——卖方立场不渲染（API 422 兜底）
stances:
  view: buyer
  allowed: [neutral, buyer]
  labels:
    neutral: 中性（未声明）
    buyer: 买方（采购方）
  # 前馈小字：不可审立场不渲染（老钱矩阵）
  note: 卖方立场审查暂不支持
category: procurement
label: 采购合同
# M3.5 评分卡分段与权重（法务老钱意见书 docs/m3.5-legal-scorecard-opinion.md）
# 权重合计 100；NA 段权重从分母剔除后线性归一取整
scorecard:
  segments:
    - key: A
      name: 主体资格（谁跟谁签、有没有权签）
      weight: 12
    - key: B
      name: 核心内容（买什么、啥时候完成）
      weight: 24
    - key: C
      name: 价款与支付（钱怎么付、留不留后手）
      weight: 14
    - key: D
      name: 违约与退出（违约怎么赔、怎么收场）
      weight: 16
    - key: E
      name: 公平性与权利归属（有没有一边倒、东西归谁）
      weight: 14
    - key: F
      name: 争议与法律适用（吵起来找谁管、按哪国法）
      weight: 10
    - key: G
      name: 程序与形式（章齐不齐、要件全不全）
      weight: 10
items:
  - id: subject
    name: 主体
    segment: A
    description: 合同主体是否完整、清晰（名称、角色、授权等）
    # 完备型兜底：补全信息常在签署页（远超 unless 窗口），unless 未放行时先查 pass 全文
    pass_fulltext_fallback: true
    rules:
      need_attention:
        # 仅有公司主体称谓，缺少完整身份信息
        - any_of:
            - "有限公司|股份有限公司|有限责任公司"
            - "甲方|乙方|买方|卖方|采购方|供货方|订购人|承供人"
          note: 仅见公司名称，未见法定代表人、住所或统一社会信用代码等完整主体信息
          unless:
            any_of:
              - "法定代表人"
              - "统一社会信用代码"
              - "住所[:：]"
              - "注册地址"
              - "经营场所"
      pass:
        - any_of:
            - "法定代表人"
            - "统一社会信用代码"
            - "住所[:：]|注册地址"
      not_found:
        - pattern: "甲方|乙方|买方|卖方|采购方|供货方|订购人|承供人"

  - id: subject_matter
    name: 标的
    segment: B
    description: 采购标的是否明确、规格数量是否可验收
    rules:
      need_attention:
        - any_of:
            - "办公主流配置"
            - "常规办公配置"
            - "通用办公配置"
            - "满足日常办公使用"
            - "日常办公所需"
            - "标准办公用机"
            - "普通商用配置"
            - "按通常办公用途配置"
            - "满足一般办公需要"
            - "日常商用标配"
            - "满足一般商务办公"
            - "不作型号锁定"
          note: 标的仅写笼统办公配置，规格型号不明确，难以验收
      pass:
        - any_of:
            - "型号"
            - "规格参数"
            - "配置清单"
            - "技术参数"
            - "产品规格"
      not_found:
        - pattern: "标的|采购|货物|设备|商品|品名|购入物"

  - id: payment
    name: 价款与支付
    segment: C
    description: 价款构成与付款节奏是否合理（先验收后付款、质保金等）
    rules:
      need_attention:
        # 背靠背/第三方付款前提簇（hardline，老钱裁决 2026-09-09；法释〔2024〕11号）。
        # 置于 need_attention 首位（小智娘门禁 P2-3：按序首中，泛化规则会抢走法条 note）。
        - any_of:
            - "背靠背"
          unless:
            - "不采用[^。]{0,8}背靠背"
            - "未采用[^。]{0,8}背靠背"
            - "不设[^。]{0,6}背靠背"
            - "不适用[^。]{0,6}背靠背"
          class: hardline
          note: 付款以第三方（业主/最终客户等）支付为前提（背靠背条款）。法释〔2024〕11号：大型企业与中小企业约定以第三方支付款项为付款前提的条款无效；条款无效后按交易习惯确定付款期限——对卖方是现金流风险，对买方亦属「伪保护」（可能即刻陷入逾期责任），请结合自身立场评估。
        - any_of:
            - "以[^。，]{0,20}(业主|建设单位|最终客户|第三方(?!支付平台|支付渠道|收款平台)|上游|甲方客户)[^。]{0,60}(支付|付款|回款|拨付|拨款)[^。]{0,12}(前提|条件)"
            # 复验回归补窄口（小智娘）：回款/拨付/拨款是第三方→甲方的钱流动，
            # 「以此为准」即背靠背核心语义；支付/付款的「为准」是审批/进度语义不收
            - "以[^。，]{0,20}(业主|建设单位|最终客户|第三方(?!支付平台|支付渠道|收款平台)|上游|甲方客户)[^。]{0,60}(回款|拨付|拨款)[^。]{0,12}(为准)"
          class: hardline
          note: 付款以第三方（业主/最终客户等）支付为前提（背靠背条款）。法释〔2024〕11号：大型企业与中小企业约定以第三方支付款项为付款前提的条款无效；条款无效后按交易习惯确定付款期限——对卖方是现金流风险，对买方亦属「伪保护」（可能即刻陷入逾期责任），请结合自身立场评估。
        - any_of:
            - "(收到|待)[^。]{0,25}(业主|建设单位|最终客户|第三方(?!支付平台|支付渠道|收款平台)|上游|甲方客户)[^。]{0,30}(支付|付款|拨付|回款|结算)[^。]{0,30}(后|再|以后)[^。]{0,15}(支付|付款|结算)"
            - "(收到|待)[^。]{0,25}(业主|建设单位|最终客户|第三方(?!支付平台|支付渠道|收款平台)|上游|甲方客户)[^。]{0,10}(款项|货款|资金|回款|工程款|进度款)[^。]{0,10}(后|再|以后)[^。]{0,15}(支付|付款|结算)"
            - "(业主|建设单位|最终客户|第三方(?!支付平台|支付渠道|收款平台)|上游|甲方客户)[^。]{0,12}(资金|款项|货款|工程款|进度款|付款)[^。]{0,15}(到账|到位)[^。]{0,20}(后|再|以后)[^。]{0,15}(支付|付款|结算)"
            - "(与|待|经)[^。]{0,6}(业主|建设单位|最终客户|第三方(?!支付平台|支付渠道|收款平台)|上游)[^。]{0,15}结算[^。]{0,12}(完成|后)[^。]{0,15}(支付|付款|结算)"
          class: hardline
          note: 付款以第三方（业主/最终客户等）支付为前提（背靠背条款）。法释〔2024〕11号：大型企业与中小企业约定以第三方支付款项为付款前提的条款无效；条款无效后按交易习惯确定付款期限——对卖方是现金流风险，对买方亦属「伪保护」（可能即刻陷入逾期责任），请结合自身立场评估。
        - any_of:
            - "合同全款|支付.{0,8}全款|全款"
            - "一次性付清|一次性支付"
            - "签约即付|签订.{0,12}即付|签署.{0,12}即付"
            - "预付全部货款|预付.{0,8}全部"
            - "签订后.{0,20}支付"
            - "免质保|不提供质保|无质保期|无需提供质保|无质保服务"
            - "全额支付货款|履约前结清全部货款"
            - "款到后发货|到账后发货"
            - "立即支付全部款项|首笔即结清"
            - "立约后.{0,12}全额支付"
            - "不设质保期|质保责任免除|售后质保不予承诺"
          note: 签约即付全款且无质保留存，违背「先验收后付款」「小额货90%+10%质保金」政策
      pass:
        - any_of:
            - "质保金"
            - "验收合格.{0,10}支付"
            - "分期支付"
            - "验收后.{0,10}付款"
      not_found:
        - pattern: "价款|总价|付款|支付|人民币|元|对价|结算"

  - id: term
    name: 期限
    segment: B
    description: 交付/履行期限是否明确
    rules:
      pass:
        - any_of:
            - "\\d+日内"
            - "\\d+天内"
            - "工作日内.{0,10}(完成|交付|送货|到场|送装)"
            - "完成送货"
            - "内完成交付|内完成送货|内完成到场|内完成送装"
      not_found:
        - pattern: "期限|日期|日内|天内"

  - id: breach
    name: 违约责任
    segment: D
    description: 违约责任是否对等、可执行
    rules:
      need_attention:
        - any_of:
            - "不得追究.{0,10}违约|甲方不得追究|不得追究乙方"
            - "放弃追究|放弃.{0,6}追究"
            - "免除违约责任|免除.{0,8}违约"
            - "不承担违约|无需承担违约"
            - "不得向.{0,8}主张违约"
            - "不负违约金义务"
            - "不得主张违约金"
            - "违约责任由.{0,10}自行承担"
            - "豁免违约责任"
          note: 单方免除乙方违约责任，权利义务严重不对等
      pass:
        - any_of:
            - "违约金"
            - "赔偿.{0,6}损失"
            - "承担违约责任"
      not_found:
        - pattern: "违约"

  - id: confidentiality
    name: 保密
    segment: E
    description: 是否约定保密义务（采购合同可较简）
    rules:
      pass:
        - any_of:
            - "保密义务"
            - "商业秘密"
            - "不得披露"
      not_found:
        - pattern: "保密"

  - id: ip
    name: 知识产权归属
    segment: E
    description: 知识产权归属是否约定
    rules:
      pass:
        - any_of:
            - "知识产权"
            - "著作权"
            - "专利权"
            - "所有权归"
      not_found:
        - pattern: "知识产权|著作权|专利"

  - id: jurisdiction
    name: 管辖与争议
    segment: F
    description: 争议解决与管辖法院是否明确
    rules:
      pass:
        - any_of:
            - "法院"
            - "仲裁"
            - "管辖"
            - "提起诉讼"
            - "提交.{0,8}仲裁"
            - "提起诉讼|向.{0,20}法院起诉"
      not_found:
        - pattern: "争议|纠纷|管辖|仲裁|诉讼"

  - id: termination
    name: 解除/终止
    segment: D
    description: 解除与终止条件是否约定
    rules:
      pass:
        - any_of:
            - "解除合同"
            - "终止本"
            - "提前解除"
            - "可以解除"
      not_found:
        - pattern: "解除|终止"

  - id: unfair_terms
    name: 格式条款/明显单方不公平
    segment: E
    description: 是否存在签收即验收、免质保、不得以发票拒付等单方不公平条款
    rules:
      need_attention:
        - any_of:
            - "签收即视为验收|签收即.{0,6}验收"
            - "签收视为合格|签收.{0,4}视为合格"
            - "收货即合格|收货即视为合格|收货视为合格"
            - "免质保|不提供质保|无质保期|无需提供质保|无质保服务"
            - "不得以发票.{0,8}拒付|不得以发票问题"
            - "发票不影响付款|发票.{0,6}不影响.{0,6}付款"
            - "到货签收等同验收|拆箱签收即终验|交付签收完成即完成验收"
            - "签收完成即终验|签收等同验收"
            # 阶段 1.3 老钱 pc11 金标（hardline，不得被 pass 词表洗白）：
            # 检验期过短且「逾期视为合格」（民法典620-622 脉络下对买方极不利）、
            # 定金没收与主给付义务脱钩（民法典586-587）
            - "逾期[^。；\\n]{0,6}视为合格|异议期[^。；\\n]{0,12}视为合格|届满[^。；\\n]{0,4}视为合格"
            - "定金[^。；\\n]{0,20}(没收|不予退还|无权要求返还)"
            - "不设质保期|质保责任免除|售后质保不予承诺"
            - "发票瑕疵不得作为拒付|票据异议不影响结算"
            - "不得以发票瑕疵"
          # 方向注记（阶段 1.3 老钱裁决配套：方向性 hardline 簇注明客观偏向）
          note: 该条明显偏向卖方。存在签收即验收、免质保、发票不得拒付等明显单方不公平条款
      pass:
        - any_of:
            - "验收标准"
            - "质保期"
            - "有权拒付"

  - id: governing_law
    name: 适用法律
    segment: F
    description: 是否明确适用法律
    # 采购合同缺少适用法律 → 需关注（非仅未找到）
    missing_as: 需关注
    missing_note: 全文检索未找到适用法律条款（未写明适用哪国/哪地法律），管辖依据不完整
    rules:
      pass:
        - any_of:
            - "适用.{0,10}法律"
            - "适用中华人民共和国"
            - "受中华人民共和国法律"
            - "依照中华人民共和国法律"
      not_found:
        - pattern: "适用法律"

  - id: signature
    name: 签署与印章
    segment: G
    description: 签署方式是否完整（签字+盖章）
    rules:
      need_attention:
        # 落款仅盖章/公章栏且无签字栏 → 需关注；正文「签字盖章后生效」不阻止
        - any_of:
            - "（盖章）|\\(盖章\\)"
            - "加盖公章|盖章确认|仅盖章"
            - "盖章[:：]"
            - "仅加盖单位印章"
            - "公章处[:：]?"
            - "加盖单位公章即可"
            - "单位公章[:：]"
          note: 仅见盖章栏，未见签字栏或授权代表签署，签署要件不完整
          unless:
            any_of:
              - "（签字|\\(签字"
              - "签字/盖章|签字并加盖"
              - "授权代表.{0,6}签字"
              - "签字栏|签名栏"
      pass:
        - any_of:
            - "（签字.{0,4}盖章"
            - "签字/盖章"
            - "签字并加盖"
            - "签字确认并盖章"
      not_found:
        - pattern: "盖章|签字|签署|公章|印章"

policies:
  - 先验收后付款；小额货90%+10%质保金
  - 质保≥12个月；签收≠验收完
  - 办公设备原则上不找小规模纳税人
  - 无合规发票可拒付
