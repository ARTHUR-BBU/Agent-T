# 采购合同审查清单（12 项）
# 规则优先用 any_of 同义/近义组，避免单点关键词脆弱匹配
# 立场元数据（阶段 1.3，法务老钱裁决书）：立场=声明+防错配，不改规则词表。
# 老钱矩阵：采购仅单一视角可审——卖方立场不渲染（API 422 兜底）
stances:
  view: buyer
  allowed: [neutral, buyer]
  labels:
    neutral: 中性（未声明）
    buyer: 买方（采购方）
  # 前馈小字：不可审立场不渲染（老钱矩阵）
  note: 卖方立场审查暂不支持
category: procurement
label: 采购合同
# M3.5 评分卡分段与权重（法务老钱意见书 docs/m3.5-legal-scorecard-opinion.md）
# 权重合计 100；NA 段权重从分母剔除后线性归一取整
scorecard:
  segments:
    - key: A
      name: 主体资格（谁跟谁签、有没有权签）
      weight: 12
    - key: B
      name: 核心内容（买什么、啥时候完成）
      weight: 24
    - key: C
      name: 价款与支付（钱怎么付、留不留后手）
      weight: 14
    - key: D
      name: 违约与退出（违约怎么赔、怎么收场）
      weight: 16
    - key: E
      name: 公平性与权利归属（有没有一边倒、东西归谁）
      weight: 14
    - key: F
      name: 争议与法律适用（吵起来找谁管、按哪国法）
      weight: 10
    - key: G
      name: 程序与形式（章齐不齐、要件全不全）
      weight: 10
items:
  - id: subject
    class: existence
    name: 主体
    segment: A
    description: 合同主体是否完整、清晰（名称、角色、授权等）
    # 完备型兜底：补全信息常在签署页（远超 unless 窗口），unless 未放行时先查 pass 全文
    pass_fulltext_fallback: true
    rules:
      need_attention:
        # 仅有公司主体称谓，缺少完整身份信息
        - any_of:
            - "有限公司|股份有限公司|有限责任公司"
            - "甲方|乙方|买方|卖方|采购方|供货方|订购人|承供人"
          note: 仅见公司名称，未见法定代表人、住所或统一社会信用代码等完整主体信息
          class: existence
          unless:
            any_of:
              - "法定代表人"
              - "统一社会信用代码"
              - "住所[:：]"
              - "注册地址"
              - "经营场所"
      pass:
        - any_of:
            - "法定代表人"
            - "统一社会信用代码"
            - "住所[:：]|注册地址"
      not_found:
        - pattern: "甲方|乙方|买方|卖方|采购方|供货方|订购人|承供人"

  - id: subject_matter
    class: heuristic
    name: 标的
    segment: B
    description: 采购标的是否明确、规格数量是否可验收
    rules:
      need_attention:
        - any_of:
            - "办公主流配置"
            - "常规办公配置"
            - "通用办公配置"
            - "满足日常办公使用"
            - "日常办公所需"
            - "标准办公用机"
            - "普通商用配置"
            - "按通常办公用途配置"
            - "满足一般办公需要"
            - "日常商用标配"
            - "满足一般商务办公"
            - "不作型号锁定"
          note: 标的仅写笼统办公配置，规格型号不明确，难以验收
          class: heuristic
      pass:
        - any_of:
            - "型号"
            - "规格参数"
            - "配置清单"
            - "技术参数"
            - "产品规格"
      not_found:
        - pattern: "标的|采购|货物|设备|商品|品名|购入物"

  - id: payment
    name: 价款与支付
    segment: C
    description: 价款构成与付款节奏是否合理（先验收后付款、质保金等）
    rules:
      need_attention:
        # 背靠背/第三方付款前提簇（hardline，老钱裁决 2026-09-09；法释〔2024〕11号）。
        # 置于 need_attention 首位（小智娘门禁 P2-3：按序首中，泛化规则会抢走法条 note）。
        - any_of:
            - "背靠背"
          unless:
            - "不采用[^。]{0,8}背靠背"
            - "未采用[^。]{0,8}背靠背"
            - "不设[^。]{0,6}背靠背"
            - "不适用[^。]{0,6}背靠背"
          class: hardline
          note: 付款以第三方（业主/最终客户等）支付为前提（背靠背条款）。法释〔2024〕11号：大型企业与中小企业约定以第三方支付款项为付款前提的条款无效；条款无效后按交易习惯确定付款期限——对卖方是现金流风险，对买方亦属「伪保护」（可能即刻陷入逾期责任），请结合自身立场评估。
        - any_of:
            - "以[^。，]{0,20}(业主|建设单位|最终客户|第三方(?!支付平台|支付渠道|收款平台)|上游|甲方客户)[^。]{0,60}(支付|付款|回款|拨付|拨款)[^。]{0,12}(前提|条件)"
            # 复验回归补窄口（小智娘）：回款/拨付/拨款是第三方→甲方的钱流动，
            # 「以此为准」即背靠背核心语义；支付/付款的「为准」是审批/进度语义不收
            - "以[^。，]{0,20}(业主|建设单位|最终客户|第三方(?!支付平台|支付渠道|收款平台)|上游|甲方客户)[^。]{0,60}(回款|拨付|拨款)[^。]{0,12}(为准)"
          class: hardline
          note: 付款以第三方（业主/最终客户等）支付为前提（背靠背条款）。法释〔2024〕11号：大型企业与中小企业约定以第三方支付款项为付款前提的条款无效；条款无效后按交易习惯确定付款期限——对卖方是现金流风险，对买方亦属「伪保护」（可能即刻陷入逾期责任），请结合自身立场评估。
        - any_of:
            - "(收到|待)[^。]{0,25}(业主|建设单位|最终客户|第三方(?!支付平台|支付渠道|收款平台)|上游|甲方客户)[^。]{0,30}(支付|付款|拨付|回款|结算)[^。]{0,30}(后|再|以后)[^。]{0,15}(支付|付款|结算)"
            - "(收到|待)[^。]{0,25}(业主|建设单位|最终客户|第三方(?!支付平台|支付渠道|收款平台)|上游|甲方客户)[^。]{0,10}(款项|货款|资金|回款|工程款|进度款)[^。]{0,10}(后|再|以后)[^。]{0,15}(支付|付款|结算)"
            - "(业主|建设单位|最终客户|第三方(?!支付平台|支付渠道|收款平台)|上游|甲方客户)[^。]{0,12}(资金|款项|货款|工程款|进度款|付款)[^。]{0,15}(到账|到位)[^。]{0,20}(后|再|以后)[^。]{0,15}(支付|付款|结算)"
            - "(与|待|经)[^。]{0,6}(业主|建设单位|最终客户|第三方(?!支付平台|支付渠道|收款平台)|上游)[^。]{0,15}结算[^。]{0,12}(完成|后)[^。]{0,15}(支付|付款|结算)"
          class: hardline
          note: 付款以第三方（业主/最终客户等）支付为前提（背靠背条款）。法释〔2024〕11号：大型企业与中小企业约定以第三方支付款项为付款前提的条款无效；条款无效后按交易习惯确定付款期限——对卖方是现金流风险，对买方亦属「伪保护」（可能即刻陷入逾期责任），请结合自身立场评估。
        # F09：付款节奏 / 质保分拆判定；note 只陈述命中证据支持的事实
        - any_of:
            - "签约即付|签订.{0,12}即付|签署.{0,12}即付"
            - "签订后.{0,20}支付"
            - "一经签署.{0,30}(支付|付清|付款)"
            - "于当日一次性支付|当日.{0,8}一次性支付"
            - "预付全部货款|预付.{0,8}全部"
            - "立即支付全部款项|首笔即结清"
            - "立约后.{0,12}全额支付"
            - "款到后发货|到账后发货"
          unless:
            - "验收合格后.{0,24}(支付|付款|付清)"
            - "验收合格.{0,10}支付"
            - "验收后.{0,12}(支付|付款|付清)"
          note: 约定签约/签订后即付或预付全部货款，未见验收后再付安排，违背「先验收后付款」政策
          class: heuristic
        - any_of:
            - "免质保|不提供质保|无质保期|无需提供质保|无质保服务"
            - "不设质保期|质保责任免除|售后质保不予承诺"
            - "质保责任.{0,8}免除|不承担质保|无质保义务"
          unless:
            - "质保金"
            - "质保期[^。；]{0,12}(月|年)"
          note: 约定免质保或不设质保，未见质保留存安排
          class: heuristic
        - any_of:
            - "合同全款|支付.{0,8}全款|全额支付货款|履约前结清全部货款"
            - "一次性付清|一次性支付"
          unless:
            - "质保金"
            - "验收合格后.{0,24}(支付|付款|付清)"
            - "验收合格.{0,10}支付"
            - "验收后.{0,12}(支付|付款|付清)"
            - "分期支付|分期付款"
          note: 约定一次性/全款支付，且未见质保金或验收后再付安排，违背「小额货90%+10%质保金」政策
          class: heuristic
      pass:
        - any_of:
            - "质保金"
            - "验收合格.{0,10}支付"
            - "分期支付"
            - "验收后.{0,10}付款"
            # F-1/F-2 第一批语义域（金标 v2：标的词∧给付动作同分句；金额兜底限
            # 价款语境——整句负护栏防违约金/赔偿/责任上限/注册资本金额冒充）
            - "(?:^|[。；，,;\\n\\r])(?:(?!违约金|赔偿|责任上限|赔偿上限|注册资本|出资)[^。，；,;\\n\\r]){0,30}(?:价款|货款|采购款|报酬|服务费用?|租金|对价|合同总价|合同金额|结算|费用)(?:(?!违约金|赔偿|责任上限|赔偿上限|注册资本|出资)[^。，；,;\\n\\r]){0,40}(?:支付|付款|付清|结清|支付给)"
            - "(?:^|[。；，,;\\n\\r])(?:(?!违约金|赔偿|责任上限|赔偿上限|注册资本|出资)[^。，；,;\\n\\r]){0,30}(?:支付|付款|付清|结清|支付给)(?:(?!违约金|赔偿|责任上限|赔偿上限|注册资本|出资)[^。，；,;\\n\\r]){0,40}(?:价款|货款|采购款|报酬|服务费用?|租金|对价|合同总价|合同金额|结算|费用)"
            - "(?:^|[。；，,;\\n\\r])(?:(?!违约金|赔偿|责任上限|赔偿上限|注册资本|出资)[^。，；,;\\n\\r]){0,30}(?:价款|总价|合同金额|费用)[^。，；,;\\n\\r]{0,20}(?:人民币|\\d+\\s?元)"
      not_found:
        - pattern: "价款|总价|付款|支付|人民币|元|对价|结算"

  - id: term
    class: existence
    name: 期限
    segment: B
    description: 交付/履行期限是否明确
    rules:
      need_attention:
        # P2 期限实质锚定（老钱裁定 2026-10-08 + 签字 2026-10-09）：待定期限
        # （另行协商/待定等）→需关注——已填写但实质悬置，届满点不确定
        - matcher: procurement_term
          require_hit_type: ["pending"]
          note: 期限条款已填写但实质待定（另行协商等），届满点不确定，需关注
          class: heuristic
      pass:
        # P2：实质期限锚定——白名单标签须带实质内容（E1 数字时长/E2 真实数字
        # 日期/E3 起止双锚无占位）；无标签数字链路（unlabeled_numeric）存量
        # 原样保留（老钱签字前置条件）。空白占位 → 未找到+旗标（见引擎 blank 通道）
        - matcher: procurement_term
          require_hit_type: ["anchored", "unlabeled_numeric"]
          note: 已约定明确的交付/履行期限
      not_found:
        - pattern: "期限|日期|日内|天内"

  - id: breach
    name: 违约责任
    segment: D
    description: 违约责任是否对等、可执行
    rules:
      need_attention:
        # F-2 对等豁免门（金标 v2，设计稿 v1.9.2 §三①）：hit_alternatives 逐
        # occurrence 判定——否定上下文（neg_sensitive 族）不构成命中；对等量词
        # →免责事由→命中词三要素同句（。/换行为硬边界，分号不断链）且豁免匹配
        # 覆盖本次命中区间（occurrence 锚定）方可豁免；unless_window=300。
        # 真单方写法（乙方免除/主体特定）不含对等量词，照旧必中。
        - hit_alternatives:
            - pattern: "不得追究.{0,10}违约"
              start_token: "不得追究"
              neg_sensitive: false
            - pattern: "甲方不得追究|不得追究乙方"
              start_token: "不得追究"
              neg_sensitive: false
            - pattern: "放弃追究"
              start_token: "放弃"
              neg_sensitive: true
            - pattern: "放弃.{0,6}追究"
              start_token: "放弃"
              neg_sensitive: true
            - pattern: "免除违约责任"
              start_token: "免除"
              neg_sensitive: true
            - pattern: "免除.{0,8}违约"
              start_token: "免除"
              neg_sensitive: true
            - pattern: "不承担违约"
              start_token: "不承担违约"
              neg_sensitive: false
            - pattern: "无需承担违约"
              start_token: "无需承担"
              neg_sensitive: false
            - pattern: "不得向.{0,8}主张违约"
              start_token: "不得向"
              neg_sensitive: false
            - pattern: "不负违约金义务"
              start_token: "不负违约金"
              neg_sensitive: false
            - pattern: "不得主张违约金"
              start_token: "不得主张"
              neg_sensitive: false
            - pattern: "违约责任由.{0,10}自行承担"
              start_token: "违约责任由"
              neg_sensitive: false
            - pattern: "豁免违约责任"
              start_token: "豁免"
              neg_sensitive: true
          unless_window: 300
          note: 单方免除乙方违约责任，权利义务严重不对等
          class: hardline
      pass:
        - any_of:
            - "违约金"
            - "赔偿.{0,6}损失"
            - "承担违约责任"
      not_found:
        - pattern: "违约"

  - id: confidentiality
    class: existence
    name: 保密
    segment: E
    description: 是否约定保密义务（采购合同可较简）
    # A2 空壳保密标签（老钱裁定 2026-10-09+用户红线，原型 14/14 全绿）三档：
    #   空话（另行协商/待定…）→需关注；实质内容（含表格跨格 tab 形态）→通过；
    #   空栏（标签+冒号/行尾后无内容）→未找到+blank_flag 旗标（不是风险警报）。
    # 判定顺序 pending>pass 由引擎 need_attention 先行保证（P2 汇总优先级同款）。
    rules:
      need_attention:
        # 空话档：标签后已填写但为悬置表述——保密义务实质未约定（P2 pending 同款）
        - pattern: "保密要求(?:[:：][ \\t]*|\\t)(?:另行协商|待定|协商确定|双方另行商定)"
          class: heuristic
          note: 保密要求栏目已填写但为「另行协商」类空话，保密义务实质悬置
        # 否认档（老钱裁定 2026-10-09 A 案：风险梯子不能倒挂——明确否认的
        # 信号强于悬置，档位不得低于需关注；同族判例「免质保→需关注」：
        # 设栏+明示不设防，「谈过并放弃」本身就是信号）
        - pattern: "保密要求(?:[:：][ \\t]*|\\t)(?:无(要求|特殊要求|特殊约定)?|不涉及|没有(特殊)?(要求|约定)|不作(任何)?(要求|约定)|无需保密)"
          class: heuristic
          note: 保密要求栏目明确填写「无要求/不涉及」等否认内容，即双方明示不设保密义务。提示两点：①即使不约定，民法典第 501 条对缔约中知悉的商业秘密仍有法定保密义务兜底，但该兜底远窄于约定保密义务（范围界定、存续期、违约金均无从主张）；②对提供技术资料、图纸、源码、数据的一方，风险尤高。
      pass:
        - any_of:
            # 原三词照旧（用户红线 2：并集不是替换）
            - "保密义务"
            - "商业秘密"
            - "不得披露"
            # 标签形态+实质内容：冒号（同格）或 tab（表格跨格）后接非空话文字。
            # tab 只来自表格同行单元格连接，正文无 tab——用它区分两种填写形态；
            # 内容首字符前瞻 (?=[^\s。…]) 防回溯把分隔空格当内容吞（外审 P1-1）；
            # tab 分支遇空占位（\t\t，外审 P1-2）前瞻失败不放行；
            # 负向断言含否认簇（老钱 P1-3 工程口径：pass 负向护栏，双保险）
            - "保密要求(?:[:：][ \\t]*|\\t)(?!另行协商|待定|协商确定|双方另行商定|无|不涉及|没有|不作)(?=[^\\s。\\n\\r\\t])[^。\\n\\r\\t]{2,}"
          # 空栏旗标（未找到分支消费）：有冒号认冒号后无内容；无冒号只认紧跟换行；
          # 表格紧邻格空（tab 后是 tab/换行/行尾，占位形态）同旗标。
          # 正文句中「保密要求。」不误旗标（无冒号+后跟句号≠栏目）
          blank_flag_pattern: "保密要求[:：][ \\t]*(?=$|[。\\n\\r])|保密要求[ \\t]*(?=\\n|$)|保密要求\\t(?=\\t|\\n|$)"
          blank_flag_note: "检测到保密要求栏目但内容空白。"
      not_found:
        - pattern: "保密"

  - id: ip
    class: existence
    name: 知识产权归属
    segment: E
    description: 知识产权归属是否约定
    rules:
      pass:
        - any_of:
            - "知识产权"
            - "著作权"
            - "专利权"
            - "所有权归"
      not_found:
        - pattern: "知识产权|著作权|专利"

  - id: jurisdiction
    class: existence
    name: 管辖与争议
    segment: F
    description: 争议解决与管辖法院是否明确
    rules:
      pass:
        - any_of:
            - "法院"
            - "仲裁"
            - "管辖"
            - "提起诉讼"
            - "提交.{0,8}仲裁"
            - "提起诉讼|向.{0,20}法院起诉"
      not_found:
        - pattern: "争议|纠纷|管辖|仲裁|诉讼"

  - id: termination
    class: existence
    name: 解除/终止
    segment: D
    description: 解除与终止条件是否约定
    rules:
      pass:
        - any_of:
            - "解除合同"
            - "终止本"
            - "提前解除"
            - "可以解除"
      not_found:
        - pattern: "解除|终止"

  - id: unfair_terms
    name: 格式条款/明显单方不公平
    segment: E
    description: 是否存在签收即验收、免质保、不得以发票拒付等单方不公平条款
    rules:
      need_attention:
        - any_of:
            - "签收即视为验收|签收即.{0,6}验收"
            - "签收视为合格|签收.{0,4}视为合格"
            - "收货即合格|收货即视为合格|收货视为合格"
            - "免质保|不提供质保|无质保期|无需提供质保|无质保服务"
            - "不得以发票.{0,8}拒付|不得以发票问题"
            - "发票不影响付款|发票.{0,6}不影响.{0,6}付款"
            - "到货签收等同验收|拆箱签收即终验|交付签收完成即完成验收"
            - "签收完成即终验|签收等同验收"
            # 阶段 1.3 老钱 pc11 金标（hardline，不得被 pass 词表洗白）：
            # 检验期过短且「逾期视为合格」（民法典620-622 脉络下对买方极不利）。
            # 审计批3 评估（肉饼 P2-1）：民法典620-622 允许约定检验期，但
            # 「异议期极短+视为合格」正是卖方格式合同最危险的写法，老钱金标
            # 第 2 层明确「不得被任何 pass 词表洗白」——本组不设 unless 豁免。
            - "逾期[^。；\\n]{0,6}视为合格|异议期[^。；\\n]{0,12}视为合格|届满[^。；\\n]{0,4}视为合格"
            - "不设质保期|质保责任免除|售后质保不予承诺"
            - "发票瑕疵不得作为拒付|票据异议不影响结算"
            - "不得以发票瑕疵"
          # 方向注记（阶段 1.3 老钱裁决配套：方向性 hardline 簇注明客观偏向）
          note: 该条明显偏向卖方。存在签收即验收、免质保、发票不得拒付等明显单方不公平条款
          class: hardline
        # 定金没收独立成核（审计批3，肉饼 PR#22 P2-1）：单独设 unless——
        # 民法典587 定金规则是双向的（收受方违约双倍返还），同时约定双倍
        # 返还属法定对称罚则而非单方偏向，不得仅凭「不予退还」字样直捕。
        # 若并入上方大 any_of，unless 会误豁免「签收即验收」等无关 pattern。
        # 豁免绑定（外部审计二轮 P1-2，Codex 反例）：裸词「双倍返还」会被
        # 「双倍返还货款」误豁免定金风险——必须双倍返还与定金绑定出现
        # （「双倍返还…定金」或「定金…双倍返还」，。；换行阻断跨句）。
        - any_of:
            - "定金[^。；\\n]{0,20}(没收|不予退还|无权要求返还)"
          unless:
            any_of:
              - "双倍返还[^。；\\n]{0,12}定金"
              - "定金[^。；\\n]{0,12}双倍返还"
          note: 定金没收/不予退还与主给付义务脱钩且无对等罚则（民法典586-587），该条明显偏向卖方
          class: heuristic
      pass:
        - any_of:
            - "验收标准"
            - "质保期"
            - "有权拒付"

  - id: governing_law
    class: existence
    name: 适用法律
    segment: F
    description: 是否明确适用法律
    # 采购合同缺少适用法律 → 需关注（非仅未找到）
    missing_as: 需关注
    missing_note: 全文检索未找到适用法律条款（未写明适用哪国/哪地法律），管辖依据不完整
    rules:
      pass:
        - any_of:
            - "适用.{0,10}法律"
            - "适用中华人民共和国"
            - "受中华人民共和国法律"
            - "依照中华人民共和国法律"
      not_found:
        - pattern: "适用法律"

  - id: signature
    class: existence
    name: 签署与印章
    segment: G
    description: 签署方式是否完整（签字+盖章）
    rules:
      need_attention:
        # 落款仅盖章/公章栏且无签字栏 → 需关注；正文「签字盖章后生效」不阻止
        - any_of:
            - "（盖章）|\\(盖章\\)"
            - "加盖公章|盖章确认|仅盖章"
            - "盖章[:：]"
            - "仅加盖单位印章"
            - "公章处[:：]?"
            - "加盖单位公章即可"
            - "单位公章[:：]"
          note: 仅见盖章栏，未见签字栏或授权代表签署，签署要件不完整
          class: existence
          unless:
            any_of:
              - "（签字|\\(签字"
              - "签字/盖章|签字并加盖"
              - "授权代表.{0,6}签字"
              - "签字栏|签名栏"
              # F-4 等价组（金标 v2：盖章栏+法人/授权代表/委托代理人落款行=完整
              # 签署要件）——必须同时进 unless 与 pass：need_attention 命中后
              # unless 不放行就直接需关注，pass 等价组轮不到评估
              - "法定代表人[:：]|授权代表[:：]|委托代理人[:：]"
              - "盖章\\)?[^。]{0,40}(?:法定代表人|授权代表|委托代理人)"
              - "(?:法定代表人|授权代表|委托代理人)\\s*[:：][^。]{0,20}(?:（盖章）|\\(盖章\\))"
              # 签名变体（租赁 15 份真实合同实证词表，统一家族同源）
              - "（签名|\\(签名"
              - "签名[/／]盖章|签名.{0,2}盖章"
      pass:
        - any_of:
            - "（签字.{0,4}盖章"
            - "签字/盖章"
            - "签字并加盖"
            - "签字确认并盖章"
            # F-4 等价组（金标 v2：盖章栏+法人/授权代表落款行=完整签署要件）
            - "盖章\\)?[^。]{0,40}(?:法定代表人|授权代表|委托代理人)"
            - "(?:法定代表人|授权代表|委托代理人)\\s*[:：][^。]{0,20}(?:（盖章）|\\(盖章\\))"
      not_found:
        - pattern: "盖章|签字|签署|公章|印章"

policies:
  - 先验收后付款；小额货90%+10%质保金
  - 质保≥12个月；签收≠验收完
  - 办公设备原则上不找小规模纳税人
  - 无合规发票可拒付
