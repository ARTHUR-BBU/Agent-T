# 租赁合同审查清单（14 项 · 法务老钱意见书 docs/lease-category-legal-opinion.md）
# 视角：我方=承租方（办公室/设备租赁），与采购合同「我方是买方」视角对齐
# 注意：引擎按 need_attention → pass → missing_as 判定；pass 词表须覆盖合同高频必备词汇
category: lease
label: 租赁合同
scorecard:
  segments:
    - key: A
      name: 主体与出租权限（谁跟谁签、有没有权出租）
      weight: 12
    - key: B
      name: 核心内容（租多久、进来时什么样、干什么用）
      weight: 24
    - key: C
      name: 租金与支付（怎么付、能不能预期）
      weight: 14
    - key: D
      name: 违约与退出（怎么赔、押金怎么退、怎么收场）
      weight: 20
    - key: E
      name: 公平性与义务划分（有没有一边倒）
      weight: 10
    - key: F
      name: 争议与法律适用（吵起来找谁管、按哪国法）
      weight: 10
    - key: G
      name: 程序与形式（章齐不齐、要件全不全）
      weight: 10
items:
  - id: subject
    name: 主体
    segment: A
    description: 合同主体是否完整、清晰（名称、角色、授权等）
    # 完备型兜底：补全信息（法定代表人/信用代码）常在签署页（远超 unless 窗口），
    # unless 窗口未放行时先查 pass 词表全文，命中即通过（小智娘租赁终验 P2）
    pass_fulltext_fallback: true
    rules:
      need_attention:
        - any_of:
            - "有限公司|股份有限公司|有限责任公司"
            - "甲方|乙方|出租方|承租方|出租人|承租人|业主|租户"
          note: 仅见公司名称或角色称谓，未见法定代表人、住所或统一社会信用代码等完整主体信息
          unless:
            any_of:
              - "法定代表人"
              - "统一社会信用代码"
              - "住所[:：]"
              - "注册地址"
              # 「经营场所」不进 unless（肉饼终验）：它只在 pass 表——只写经营场所
              # 的合同必须落需关注（主体信息不完整），不能被 unless 放行成通过
      pass:
        - any_of:
            - "法定代表人"
            - "统一社会信用代码"
            - "住所[:：]|注册地址"
            # 「经营场所」不进 pass（原为对 unless 的对称补位，pass_fulltext_fallback
            # 落地后它会把只写经营场所的合同洗成通过）：它是弱地址信号，
            # 只写经营场所的合同应直接落需关注（肉饼终验点3）
      not_found:
        - pattern: "甲方|乙方|出租方|承租方|出租人|承租人"

  - id: lessor_title
    name: 出租权限
    segment: A
    description: 出租方是否产权人/有权出租（二房东无授权是承租方最大硬伤）
    # 出租权限是文本审查唯一无法自证、出错代价最大的点，刻意加严
    missing_as: 需关注
    missing_note: 全文未见出租方产权或出租权限表述，无法从文本确认其有权出租，请人工核验产权证或授权文件
    rules:
      need_attention:
        - any_of:
            - "受.{0,8}委托出租|受托出租|代.{0,6}(产权人|业主|房东).{0,4}出租"
            - "二房东"
            - "转租自|系转租|属于转租|本合同.{0,10}转租"
          note: 出租方疑似非产权人（转租/受托出租），未见产权人同意或授权链条，真权利人可主张解除
          unless:
            any_of:
              - "产权人.{0,8}(书面)?同意"
              - "委托出租|授权出租|出租授权|经授权"
              - "原租赁合同|上手租赁合同"
        # 否定事实直捕（肉饼审计 P1）：unless 会被「未经产权人同意」的子串
        # 「产权人同意」误放行，这里把否定表述本身作为需关注信号兜底
        - any_of:
            - "未经(产权人|业主|房东|所有权人|原出租方)[^。；\\n]{0,8}(书面)?同意"
            - "未经(产权人|业主|房东|所有权人)[^。；\\n]{0,8}(授权|委托)"
            - "未获(产权人|业主|房东|所有权人)[^。；\\n]{0,8}(同意|授权|委托)"
            - "未取得(产权人|业主|房东|所有权人)[^。；\\n]{0,8}(同意|授权|委托)"
            - "非产权人(出租|转租|对外出租)"
          note: 出租方未经产权人同意/授权出租或转租，权属链条存疑，真权利人可主张解除
          # 保护性 boilerplate 排除（小智娘终验 P1）：「未经产权人同意，乙方不得转租」
          # 是转租须经同意的常规保护条款（民法典716 默认安排），不是权属缺陷信号
          unless:
            any_of:
              - "(不得|禁止)[^。；\\n]{0,6}(转租|分租|出租|转借)"
              - "须经[^。；\\n]{0,8}(同意|授权)"
      pass:
        - any_of:
            - "不动产权证|产权证|房地产权证|房屋所有权证"
            - "有权出租|依法出租|合法出租|享有.{0,8}出租(权|权利)"
            - "产权人|所有权人|产权清晰"
      not_found:
        - pattern: "产权|出租权|所有权|委托"

  - id: lease_term
    name: 租期与续租
    segment: B
    description: 租期起止是否明确，续租与优先承租权是否有安排
    # 无租期 = 不定期租赁，出租方可随时解除（民法典730条），属实质缺口
    missing_as: 需关注
    missing_note: 全文未找到租期/租赁期限约定，构成不定期租赁时出租方可随时解除，承租方稳定性无保障
    rules:
      need_attention:
        - any_of:
            - "不定期租赁"
            - "租期.{0,8}另行通知|租期.{0,6}长期有效|租期不限"
          note: 租期不定期或不明确，出租方可随时解除（民法典730条），承租方经营/使用稳定性无保障
      pass:
        - any_of:
            - "租赁期限|租期|租赁期"
            - "自.{0,12}年.{0,4}月.{0,4}日起.{0,30}止"
            - "租期为.{0,10}(年|个月|月)"
            - "续租|优先承租|优先续租|续约"
      not_found:
        - pattern: "租期|租赁期限|租赁期|续租"

  - id: delivery_acceptance
    name: 交付与验收
    segment: B
    description: 交付状态（毛坯/带装/现状）与消防、交接确认是否明确
    rules:
      need_attention:
        - any_of:
            - "现状交付.{0,20}概不负责|按现状.{0,10}(不承担|概不负责)"
            - "交付现状.{0,12}不承担.{0,8}责任|现状.{0,6}视为.{0,6}符合.{0,6}要求"
          note: 「现状交付概不负责」类一揽子免责，交付质量瑕疵风险全部推给承租方
      pass:
        - any_of:
            - "交付标准|交付状态|交付条件"
            - "毛坯|带装修|精装修|现状交付"
            - "消防验收|消防合格|消防备案"
            - "交接单|交付清单|验收单|交房确认"
      not_found:
        - pattern: "交付|移交|进场|交房"

  - id: use_restriction
    name: 用途与证照
    segment: B
    description: 用途限制是否明确，出租方对证照办理/备案有无配合义务
    rules:
      need_attention:
        - any_of:
            - "不予配合|不配合.{0,12}(证照|执照|备案|办理)"
            - "证照.{0,10}(概由|均由).{0,6}(乙方|承租方).{0,10}(办理|承担).{0,10}(甲方|出租方).{0,8}无关"
          note: 出租方对证照办理/备案负有配合义务，明确不配合将影响承租方实际使用与经营合规
        - any_of:
            - "改变用途.{0,16}(解除|收回|没收)|擅自改变用途.{0,20}(解除|收回|没收)"
          note: 用途轻微偏离即触发解除/收回/没收，违约后果与违约程度失衡
      pass:
        - any_of:
            - "用途"
            - "经营|办公"
            - "营业执照|证照办理|协助办理|配合办理|备案"
      not_found:
        - pattern: "用途|经营|办公"

  - id: rent_payment
    name: 租金与支付
    segment: C
    description: 押付方式、租金递增机制、免租期、逾期宽限是否合理可控
    rules:
      need_attention:
        - any_of:
            - "一次性.{0,6}(支付|付清).{0,10}租金|租金.{0,8}一次性(支付|付清)"
            - "预付.{0,8}(一|1|两|2|整)年.{0,4}租金|预付全部租金|租金.{0,8}按年预付"
          note: 长周期/全额预付租金，资金占用与被动敞口过大（行业惯例为押二付三/押一付三量级）
        - any_of:
            - "递增.{0,12}(由甲方|由出租方|另行通知|不设上限)"
            - "租金.{0,10}调整.{0,8}(权|由).{0,8}(甲方|出租方)"
            - "调价.{0,10}单方|租金.{0,8}上涨.{0,8}另行通知"
          note: 租金递增/调整幅度由出租方单方决定或不设上限，租金成本不可预期
        - any_of:
            - "免租期.{0,12}(取消|作废|追回|补缴)|提前退租.{0,16}免租期.{0,12}(补缴|追回)"
          note: 提前解约时免租期租金追回，实际退出成本倍增
        - any_of:
            # 数字集全量中文数字+阿拉伯（肉饼审计 P2：原版漏 七日/十日/7日）
            - "逾期.{0,6}[一二两三四五六七八九十0-9]{1,3}日.{0,24}(解除|收回|停水|停电|断电|断水)"
          note: 逾期宽限期过短即赋予解除/收回权，支付容错极低
        # 催收手段独立成核（肉饼审计 P2：宽限长短是加重情节，断水断电才是风险本体）
        - any_of:
            - "断水断电|断水、?断电|停水停电|(停水|停电|断电|断水)[^。；\\n]{0,12}(催|迫|收回|解除)"
          note: 以断水断电等手段催收租金，可能损及承租方正常经营与安全，催收手段本身即风险点
          # 禁止性保护条款排除（小智娘终验 P2）：「甲方不得断水断电」是承租方友好条款
          unless:
            any_of:
              - "(甲方|出租方|任何一方)[^。；\\n]{0,10}(不得|禁止)"
              - "(不得|禁止)[^。；\\n]{0,8}(断水|断电|停水|停电)"
      pass:
        - any_of:
            - "押.{1,3}付.{1,3}"
            - "每.{1,2}(月|季|年).{0,6}支付|按.{1,3}(月|季|年)支付"
            - "免租期"
            - "租金.{0,6}为.{0,20}元"
            # 常见支付约定词（回放校准 F4：真实合同写「租金标准/支付时间/交纳期限」
            # 被误判「未找到」）
            - "支付时间|支付方式|租金标准|交纳(期限|方式)|月租金"
      not_found:
        - pattern: "租金|支付|元"

  - id: deposit
    name: 押金
    segment: D
    description: 押金没收/扣减边界是否与实际损失挂钩、退还条件是否明确
    rules:
      need_attention:
        - any_of:
            - "押金.{0,10}(不予退还|不退|没收)|没收押金"
            # 「保证金」系直捕（回放校准 F3：真实没收写法「拒绝返还保证金」
            # 「没收壹个月租金的履约保证金」因措辞漏报；老钱裁决三认可并放宽
            # 窗口至20字、补「不予返还」——租赁语境四词同指金钱担保，漏报优先于误报）
            - "拒绝(返还|退还)[^。；\\n]{0,6}(押金|保证金)"
            - "没收[^。；\\n]{0,12}(履约)?保证金|(履约)?保证金.{0,10}(没收|不退|不予退还)"
            - "(押金|保证金)[^。；\\n]{0,20}(不予退还|不予返还|不退|没收)"
            - "扣除全部押金|押金.{0,10}作为违约金|视为放弃押金"
            - "从押金中扣除.{0,24}(一切|全部|所有|各项)"
            # 同义改写直捕（小智娘对抗测试 P1：原词表被「全额扣除+无权要求返还」洗白）
            - "押金[^。；\\n]{0,20}全额扣除|全额扣除[^。；\\n]{0,10}押金"
            - "无权要求返还|无权要求退还"
            - "发生任何违约[^。；\\n]{0,16}扣除|任何违约情形[^。；\\n]{0,16}扣除"
          note: 押金没收/全扣条款与实际损失脱钩（民法典585条可主张调减，但事后主张不等于事前无风险）
          # 保护性条款排除（肉饼复审 P2-1）：「甲方不得拒绝返还/不得没收押金」
          # 是承租方友好条款，不得误伤（与 lessor_title/rent_payment/renovation 先例对齐）
          unless:
            any_of:
              - "(不得|禁止)[^。；\\n]{0,6}(没收|拒绝|不予退|不予返)"
      pass:
        - any_of:
            - "押金|保证金|租赁保证金"
            - "无息退还|按时退还|退还.{0,12}(日|天内|工作日)"
      not_found:
        - pattern: "押金|保证金"

  - id: early_termination
    name: 提前解约与违约金
    segment: D
    description: 提前退租的违约金计算方式与解除权配置是否剥夺退出权
    rules:
      need_attention:
        - any_of:
            - "剩余租期.{0,12}租金.{0,10}(作为|为)?违约金|违约金.{0,12}剩余租期.{0,8}租金"
            - "提前退租.{0,20}(支付|赔偿).{0,12}剩余.{0,8}租金"
            - "已付租金.{0,12}不予退还"
          note: 提前退租违约金按剩余租期全部租金计/已付租金不退，实质剥夺承租方退出权
        # 同义改写直捕（小智娘对抗测试 P1：中途解约/未履行租期租金总额/提前终止）
        - any_of:
            - "(中途解约|提前终止)[^。；\\n]{0,24}(赔偿|支付|违约金|租金)"
            # 绑定「总额」语义：按未履行部分比例计违约金（20% 等）是合理条款，不得误伤
            - "未履行[^。；\\n]{0,14}租金总额|租金总额[^。；\\n]{0,14}(违约|赔偿)|违约金[^。；\\n]{0,20}未履行[^。；\\n]{0,14}租金总额"
          note: 提前终止/中途解约的违约金与未履行租期租金总额挂钩，实质剥夺承租方退出权
          # 比例/中性结算语境排除（小智娘终验 P2）：20% 比例违约金、一个月租金、
          # 租金算至腾退日都是合理约定，不构成「剥夺退出权」
          unless:
            any_of:
              - "按未履行部分|百分之|按[^。；\\n]{0,4}[0-9一二九十]+ ?%|相当于|计算至|腾退"
        - any_of:
            - "乙方不得.{0,6}(提前)?解除|承租方不得提前退租"
            - "仅.{0,4}(甲方|出租方).{0,8}(享有|有).{0,6}解除权|解除权归.{0,6}(甲方|出租方)"
          note: 解除权单方配置，承租方无退出通道
      pass:
        - any_of:
            - "提前.{0,6}(退租|解除|解约)"
            - "违约金"
            - "书面通知.{0,12}(解除|退租)"
      not_found:
        - pattern: "解除|退租|违约"

  - id: renovation
    name: 装修与恢复原状
    segment: D
    description: 装修归属与补偿、退租恢复原状义务及费用承担
    rules:
      need_attention:
        - any_of:
            - "恢复原状.{0,20}(费用).{0,10}(由乙方|承租方|自费|自行承担)"
            - "(退租|租赁期满).{0,12}恢复.{0,4}(毛坯|原状|原样)"
            # 语序变体直捕（小智娘对抗测试 P1：费用在前，「自负费用将房屋恢复原状」）
            - "(自负|自行承担|自担|自费)[^。；\\n]{0,8}费用[^。；\\n]{0,12}恢复.{0,4}(毛坯|原状|原样)"
          note: 退租须恢复原状且费用自担，是带装进场/长租户的显著退出成本（装修残值损失）
          # 否定通道：写明「无需/不必恢复原状」是承租方友好条款，不是负担（开发狗调优）
          unless:
            any_of:
              - "无需.{0,4}恢复|无须.{0,4}恢复|不必.{0,4}恢复|不用.{0,4}恢复|免于恢复"
              - "恢复原状.{0,12}(义务|费用).{0,8}(由|归).{0,6}(甲方|出租方)"
        - any_of:
            # 跨句误配修复（小智娘 P1误报）：句界不越过——「装修归乙方所有。房屋维修由甲方」
            # 曾被 .{0,8} 跨过句号误配成装修归甲方
            - "装修.{0,10}(归|无偿归|所有)[^，。；！？\\n]{0,8}(甲方|出租方)"
            - "添附.{0,12}(归|无偿归)[^，。；！？\\n]{0,8}(甲方|出租方)|装修[^，。；！？\\n]{0,8}不予补偿"
          note: 承租方出资装修无偿归出租方且不予补偿，投入损失敞口
      pass:
        - any_of:
            - "装修|装饰|装潢"
            - "恢复原状|添附|残值|装修补偿"
      not_found:
        - pattern: "装修|装饰|装潢|恢复原状"

  - id: maintenance
    name: 维修义务划分
    segment: E
    description: 结构性维修与日常损耗的义务划分是否倒挂
    rules:
      need_attention:
        - any_of:
            - "维修.{0,10}(均由|均归|全部由|全部归|概由).{0,4}(乙方|承租方)"
            - "一切维修.{0,10}(乙方|承租方)"
            - "维修.{0,8}(义务|责任).{0,10}(全部|均).{0,6}(乙方|承租方)"
          note: 维修义务（含结构性维修与大修）全部推给承租方，与民法典712/713条出租人维修义务的默认安排相反，划分一边倒
      pass:
        - any_of:
            - "维修.{0,10}(由|归|属).{0,8}(甲方|出租方)|维修责任"
            - "自然损耗|正常损耗"
            - "保修"
      not_found:
        - pattern: "维修|维护|保养|修缮"

  - id: subletting
    name: 转租与分租
    segment: E
    description: 转租限制与违约后果是否失衡（经同意可转租是法定默认）
    rules:
      need_attention:
        - any_of:
            - "不得转租.{0,24}(解除|收回|没收)"
            - "(擅自|私自)转租.{0,24}(解除|收回|没收|全部损失)"
          note: 转租禁止叠加即时解除/没收押金，后果与违约程度失衡（民法典716条仅赋出租人解除权，没收押金无据）
      pass:
        - any_of:
            - "转租|分租"
      not_found:
        - pattern: "转租|分租"

  - id: jurisdiction
    name: 管辖与争议
    segment: F
    description: 争议解决与管辖法院/仲裁是否明确
    rules:
      pass:
        - any_of:
            - "法院"
            - "仲裁"
            - "管辖"
            - "提起诉讼"
            - "提交.{0,8}仲裁"
            - "向.{0,20}法院起诉"
      not_found:
        - pattern: "争议|纠纷|管辖|仲裁|诉讼"

  - id: governing_law
    name: 适用法律
    segment: F
    description: 适用法律仅跨境合同有审查意义；纯境内租赁本类不适用（法务老钱裁决，
      见 docs/lease-replay-calibration.md——选法意思自治以涉外民事关系为前提
      （涉外民事关系法律适用法第3条），民法典470条合同一般条款不含适用法律项，
      缺失不构成要件缺失；协议管辖（民诉法第35条）独立有效）
    # 本类不适用（老钱裁决一，2026-09-07）：15 份真实合同 14 份被标需关注，
    # 国内租赁实践不写适用法律条款，常驻噪音会稀释其他真风险项的注意力。
    # NDA 品类维持「缺适用法律→需关注」不变（涉外高频，是真红线）
    na: true
    na_reason: 纯境内租赁合同依法当然适用中华人民共和国法律，不存在选择外国法的空间，本项不适用

  - id: signature
    name: 签署与印章
    segment: G
    description: 签署方式是否完整（签字+盖章）
    missing_as: 需关注
    missing_note: 全文未找到签署与印章约定（签署要件缺失）
    rules:
      need_attention:
        - any_of:
            - "（盖章）|\\(盖章\\)"
            - "加盖公章|盖章确认|仅盖章"
            - "盖章[:：]"
            - "仅加盖单位印章"
            - "公章处[:：]?"
            - "加盖单位公章即可"
            - "单位公章[:：]"
          note: 仅见盖章栏，未见签字栏或授权代表签署，签署要件不完整
          unless:
            any_of:
              - "（签字|\\(签字"
              # 回放校准 F2：签署要件等价写法全集（15 份真实合同实证，
              # 仅盖章误报 10 份中 7 份因这些变体漏放）
              - "（签名|\\(签名"
              - "签字[/／]盖章|签字.{0,2}（?盖章"
              - "签字并加盖|签字盖章后生效"
              - "授权代表.{0,6}签字|授权代理.{0,4}签字"
              - "签字栏|签名栏"
              - "签字后生效|签字之日起生效|签名后生效"
              - "签名[/／]盖章|签名.{0,2}盖章"
              # 民法典490条第三种法定签署方式（老钱裁决二：个人住宅租赁常见）
              - "按.{0,2}指印|捺印"
      pass:
        - any_of:
            - "（签字.{0,4}盖章"
            - "签字/盖章"
            - "签字并加盖"
            - "签字确认并盖章"
            - "签字盖章后生效"
            - "（签名|\\(签名"
            - "签字.{0,2}（?盖章"
            - "签字后生效|签字之日起生效"
            - "签名[/／]盖章|签名.{0,2}盖章"
            - "按.{0,2}指印|捺印"
      not_found:
        - pattern: "盖章|签字|签署|公章|印章"

policies:
  - 视角固定为承租方：重点盯退出通道、押金安全、义务划分是否倒挂
  - 出租方默认负维修义务（民法典712/713条）；结构性维修与大修不得整体转嫁承租方
  - 押金没收/全扣须与实际损失挂钩，退还应有时限（民法典585条可主张调减，但事后主张≠事前无风险）
  - 提前退租违约金不得按剩余租期全部租金计
  - 转租须经出租方同意（民法典716条）；禁止转租可约定，但叠加没收押金无据
  - 适用法律仅跨境合同需审查（纯境内租赁本项不适用，管辖条款独立有效即可）
  - 签署须签字（或签名/按指印，民法典490条等价）+盖章
