# M3.5 评分卡禁语清单（法务老钱意见书第六节）
# 命中即拦截：整段重试一次，二次命中丢弃评语仅输出分数+免责句
# A/C 两类同时做输出后二次校验（责任风险最高）
forbidden:
  # A 类 整体性背书（绝对禁）：文本审查只能给「未发现」，不能给「不存在」
  category_a:
    - 本合同没有问题
    - 没有问题
    - 不存在法律风险
    - 无任何风险
    - 条款完备无瑕疵
    - 可以放心签署
    - 建议直接签署
    - 按现状签署即可
    - 不需要修改
    - 万无一失
    - 零风险
    - 绝对安全
    - 确保不受任何损失
    # 租赁品类特有（法务老钱意见书 §七，归 A 类：效力越权+绝对化判断合成）
    - 递增条款违法
    - 递增条款无效
    - 递增约定无效
    - 所以合同无效
    - 这份合同无效
    - 押金肯定能退
    - 押金一定能退
    - 到期不会赶你走
  # B 类 效力越权判断：效力认定权在法院/仲裁
  category_b:
    - 该条款无效，所以不用理会
    - 不具法律效力
    - 签了也白签
    - 必定败诉
  # C 类 推翻规则档位：把「需关注」解释向「通过」
  # （阶段 3 异议语境变体，2026-09-15：异议层天然要说「疑似误报」，模型极易
  # 顺嘴滑向「本条无风险/结论应改」——异议是候选不是改判，档位变更唯一
  # 通道是版本化规则修订）
  category_c:
    - 虽有提示但可以忽略
    - 前述提示不影响签署
    - 该规则提示过于保守
    - 规则标错了
    - 提示不影响签署
    - 问题不大
    - 本条实际无风险
    - 该条并无风险
    - 异议成立，档位应改
    - 结论应改为通过
    - 这条不需要关注
    - 应当视为通过
  # D 类 替代性声明：本评分不构成法律意见（免责句为必备项，另在代码校验）
  category_d:
    - 构成正式法律意见
    - 可替代律师审查
    - 无需再咨询律师
    - 无需咨询律师
  # E 类 保证性预测：不得预测未来事件
  category_e:
    - 不会违约
    - 不会被触发
    - 实践中通常没事
    - 不会发生纠纷
    - 不会有争议
