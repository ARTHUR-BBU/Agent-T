# 保密协议（NDA）审查清单（12 项 · M3 金标）
# 价款与支付对本类始终「本类不适用」，不按「未找到」报警
# 规则优先用 any_of 同义/近义组，避免单点关键词脆弱匹配
category: nda
label: 保密协议
items:
  - id: subject
    name: 主体（谁跟谁签）
    description: 合同主体是否完整、清晰（谁跟谁签）
    rules:
      need_attention:
        - any_of:
            - "有限公司|股份有限公司|有限责任公司"
            - "甲方|乙方|披露方|接收方|提供方|接收人"
          note: 仅见公司名称或角色称谓，未见法定代表人、住所或统一社会信用代码等完整主体信息
          unless:
            any_of:
              - "法定代表人"
              - "统一社会信用代码"
              - "住所[:：]"
              - "注册地址"
              - "经营场所"
      pass:
        - any_of:
            - "法定代表人"
            - "统一社会信用代码"
            - "住所[:：]|注册地址"
      not_found:
        - pattern: "甲方|乙方|披露方|接收方"

  - id: confidentiality_scope
    name: 保密范围与义务（什么算秘密、要怎么守）
    description: 保密信息范围与保密义务是否闭环（什么算秘密、要怎么守）
    rules:
      pass:
        # all_of 两项：范围 OR 组 + 义务 OR 组（引擎按字符串元素 AND，元素内可用 |）
        - all_of:
            - "保密信息|商业秘密|技术资料|经营信息|专有信息"
            - "不得.{0,8}披露|不得向第三方|保密义务|承担保密|严格保密|不得用于.{0,12}以外"
      not_found:
        - pattern: "保密信息|商业秘密|保密义务|披露"

  - id: payment
    name: 价款与支付
    description: NDA 通常不涉及对价；本类不适用，不按「未找到」报警
    na: true
    na_reason: 本类无对价，不按缺项报警

  - id: agreement_term
    name: 协议期限（这份协议管多久）
    description: 协议本身有效期是否明确（与保密存续期分开看）
    rules:
      pass:
        - any_of:
            - "本协议有效期"
            - "协议期限"
            - "本协议自.{0,20}起.{0,20}止"
            - "本协议自签署之日起.{0,12}年"
            - "合同有效期"
            - "协议有效期为"
            - "本协议期限为"
      not_found:
        - pattern: "有效期|协议期限|本协议自"

  - id: confidentiality_duration
    name: 保密存续期（秘密要守到哪一天——和协议期限分开看）
    description: 保密义务存续期是否明确、合理（与协议期限分开；禁止「永久」一刀切）
    missing_as: 需关注
    missing_note: 全文未找到保密存续期约定（秘密要守到哪一天不明确）
    rules:
      need_attention:
        - any_of:
            - "永久保密"
            - "保密义务永久"
            - "永久承担保密"
            - "无限期保密"
            - "保密期限为永久"
            - "保密.{0,6}永久"
            - "永久.{0,8}保密义务"
            - "无限期承担保密"
            - "永不解除保密"
            - "保密义务无限期"
          note: 「永久」或无限期一刀切保密，存续期不合理，需关注
      pass:
        - any_of:
            - "保密期限"
            - "保密存续"
            - "保密义务.{0,12}年"
            - "自签署之日起.{0,20}保密"
            - "不少于.{0,6}年"
            - "保密义务持续"
            - "信息进入公知领域"
            - "保密义务自.{0,20}止"
            - "存续期为"
      not_found:
        - pattern: "保密期限|保密存续|永久保密"

  - id: breach
    name: 违约责任
    description: 违约责任是否约定、可执行
    rules:
      need_attention:
        - any_of:
            - "不得追究.{0,10}违约"
            - "放弃追究"
            - "免除违约责任|免除.{0,8}违约"
            - "不承担违约|无需承担违约"
            - "豁免违约责任"
            - "违约责任由.{0,10}自行承担"
          note: 单方免除或放弃追究违约责任，权利义务不对等
      pass:
        - any_of:
            - "违约金"
            - "赔偿.{0,6}损失"
            - "承担违约责任"
            - "违约方应"
            - "违反本协议.{0,12}赔偿"
      not_found:
        - pattern: "违约"

  - id: unfair_terms
    name: 格式条款 / 单方不公平
    description: 是否存在明显单方不公平条款
    rules:
      need_attention:
        - any_of:
            - "不得追究"
            - "单方免除"
            - "无限责任"
            - "接收方.{0,20}不得主张"
            - "披露方有权单方"
            - "无需通知即可"
            - "放弃一切权利"
            - "放弃.{0,6}抗辩"
            - "单方决定"
            - "解释权归.{0,10}所有"
            - "最终解释权"
            - "无条件同意"
            - "不得异议"
          note: 存在明显单方不公平或格式条款压制表述
      pass:
        - any_of:
            - "双方协商"
            - "平等协商"
            - "经双方书面"
            - "双方另行约定"
            - "权利义务对等"
            - "本协议"

  - id: ip
    name: 知识产权归属
    description: 知识产权归属是否约定；知产归接收方须需关注
    rules:
      need_attention:
        - any_of:
            - "知识产权.{0,12}归接收方"
            - "知识产权归属接收方"
            - "归接收方所有"
            - "接收方享有.{0,12}知识产权"
            - "接收方拥有.{0,12}知识产权"
            - "知识产权.{0,8}转让给接收方"
            - "知产归接收方"
            - "全部知识产权归乙方"
            - "知识产权归乙方所有"
            - "接收方自动取得"
            - "接收方无偿取得.{0,12}知识产权"
          note: 知产归接收方，披露方风险过高，需关注
      pass:
        - any_of:
            - "知识产权.{0,12}归.{0,6}(披露|提供|甲方)"
            - "各自.{0,6}知识产权"
            - "原有知识产权仍归"
            - "知识产权归属由双方"
            - "另行书面约定"
            - "不转移知识产权"
            - "不构成知识产权转让"
            - "知识产权仍归"
      not_found:
        - pattern: "知识产权|著作权|专利"

  - id: jurisdiction
    name: 管辖与争议
    description: 争议解决与管辖是否明确
    rules:
      pass:
        - any_of:
            - "法院"
            - "仲裁"
            - "管辖"
            - "提起诉讼"
            - "提交.{0,8}仲裁"
            - "向.{0,20}法院起诉"
      not_found:
        - pattern: "争议|纠纷|管辖|仲裁|诉讼"

  - id: termination
    name: 解除与终止
    description: 解除与终止条件是否约定
    rules:
      pass:
        - any_of:
            - "解除本协议"
            - "终止本协议"
            - "提前解除"
            - "可以解除"
            - "书面通知解除"
            - "协议终止"
            - "解除或终止"
      not_found:
        - pattern: "解除|终止"

  - id: governing_law
    name: 适用法律
    description: 是否明确适用法律（仅有管辖无适用法律 → 需关注）
    missing_as: 需关注
    missing_note: 全文检索未找到适用法律条款（未写明适用哪国/哪地法律）；仅有管辖约定不够
    rules:
      pass:
        - any_of:
            - "适用.{0,10}法律"
            - "适用中华人民共和国"
            - "受中华人民共和国法律"
            - "依照中华人民共和国法律"
            - "受.{0,20}法律管辖"
            - "适用.{0,6}法"
      not_found:
        - pattern: "适用法律"

  - id: signature
    name: 签署与印章
    description: 签署方式是否完整（签字+盖章）；缺失须需关注
    missing_as: 需关注
    missing_note: 全文未找到签署与印章约定（签署要件缺失）
    rules:
      need_attention:
        - any_of:
            - "（盖章）|\\(盖章\\)"
            - "加盖公章|盖章确认|仅盖章"
            - "盖章[:：]"
            - "仅加盖单位印章"
            - "公章处[:：]?"
            - "加盖单位公章即可"
            - "单位公章[:：]"
          note: 仅见盖章栏，未见签字栏或授权代表签署，签署要件不完整
          unless:
            any_of:
              - "（签字|\\(签字"
              - "签字/盖章|签字并加盖"
              - "授权代表.{0,6}签字"
              - "签字栏|签名栏"
      pass:
        - any_of:
            - "（签字.{0,4}盖章"
            - "签字/盖章"
            - "签字并加盖"
            - "签字确认并盖章"
            - "签字盖章后生效"
      not_found:
        - pattern: "盖章|签字|签署|公章|印章"

policies:
  - 保密义务应对等，期限合理；禁止「永久」一刀切
  - 保密范围与义务宜闭环可识别，避免无限扩大
  - 协议期限与保密存续期分开约定
  - 知产不得默认归接收方
  - 须写明适用法律；仅有管辖不够
  - 签署须签字+盖章
