[project]
name = "agent-t"
version = "0.1.0"
description = "合同审查 Agent MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.5.0",
  "httpx>=0.27.0",
  "PyYAML>=6.0.1",
  "langgraph>=0.2.0",
  "langchain-core>=0.2.0",
  "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0", "pyright>=1.1.380", "playwright>=1.48.0"]
docs = ["docling>=2.0.0", "pypdf>=4.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live_llm: 真实 LLM Key 专项（无 Key 自动 skip；验收专项跑，不进 CI 门禁）",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 外审批 3 起步集：pyflakes（F）+ 基础错误（E4/E7/E9）。
# 扩展规则（S/SIM/B/PERF 等）待卫生批逐类收编，避免一次性大改污染 diff。
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = ["app"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
# 存量类型债分批还：先让 basic 模式跑起来，报错清零后再考虑 standard
