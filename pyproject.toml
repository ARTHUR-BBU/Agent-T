[project]
name = "agent-t"
version = "0.1.0"
description = "合同审查 Agent MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.5.0",
  "httpx>=0.27.0",
  "PyYAML>=6.0.1",
  "langgraph>=0.2.0",
  "langchain-core>=0.2.0",
  "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
docs = ["docling>=2.0.0", "pypdf>=4.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
