name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖与 lint 工具（pyright 需项目依赖解析 import）
        run: |
          pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -r requirements-dev.txt  # lint 工具精确锁版（审计 G：防工具升级自行漂移）
      - name: Ruff（外审批 3：F+基础 E 集；扩展规则待卫生批收编）
        # tools/m65/ 下的生产运维脚本纳入最小检查（证据核验+生产对照并发版，
        # 外审修复卡④ + PR #103 修复卡：脚本自身也要过格式检查）
        run: python -m ruff check app tests tools/m65/verify_prod_evidence.py tools/m65/prod_regression.py
      - name: Pyright（basic 模式，存量 0 错误为门禁基线）
        run: python -m pyright app

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖（lock 冒烟：requirements-lock.txt 必须可安装可复现）
        run: |
          pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install pytest playwright
      # 外审批 3：Playwright 浏览器 E2E 正式进 required CI——此前远程 CI
      # 无浏览器时 e2e 整模块 skip，前端回归只有本地跑（审计点名 752 vs 794 口径差）
      - name: 安装 Chromium
        run: python -m playwright install --with-deps chromium
      # test_precheck_corpus.py 是 live_llm 专项（无 Key 全 skip 的常态），
      # 显式排除与本地口径对齐（CI flake：run 34910117239 首跑 429 假红灯）
      # 测试环境显式无 Key（肉饼门禁 P3-5 防御：测试必须确定性，Key 泄进
      # CI 会让 live 层真烧钱；空串在 llm_ask 的 `or None` 口径下等价未设）
      - name: 运行全量测试（含浏览器 E2E）
        env:
          DEEPSEEK_API_KEY: ""
          ZHIPU_API_KEY: ""
          GLM_API_KEY: ""
          XAI_API_KEY: ""
          GROK_API_KEY: ""
          PRECHECK_LIVE: ""
        run: python -m pytest -q --ignore=tests/test_precheck_corpus.py
      # F-12 施工批1：17 份真实合同回归进 required 门禁（外审验收整改卡②）——
      # 零回退红线只有非零退出码才能拦坏提交（回归报告是证据，不是门禁）；
      # 明细写 $RUNNER_TEMP 防测试运行污染受版本控制的工作树
      - name: 17 份真实合同回归门禁（零回退红线）
        run: python -X utf8 tools/m65/regression_batch1.py --out "$RUNNER_TEMP/batch1-regression.json"
