name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖（lock 冒烟：requirements-lock.txt 必须可安装可复现）
        run: |
          pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install pytest
      # Playwright E2E 未装浏览器时整模块自动 skip；远程 CI 证明的是
      # 315+ 条单元/API/金标回归（外部审计：此前无远程 CI 证据）
      # test_precheck_corpus.py 是 live_llm 专项（无 Key 全 skip 的常态），
      # 显式排除与本地口径对齐（CI flake：run 34910117239 首跑 429 假红灯）
      # 测试环境显式无 Key（肉饼门禁 P3-5 防御：测试必须确定性，Key 泄进
      # CI 会让 live 层真烧钱；空串在 llm_ask 的 `or None` 口径下等价未设）
      - name: 运行全量测试
        env:
          DEEPSEEK_API_KEY: ""
          ZHIPU_API_KEY: ""
          GLM_API_KEY: ""
          XAI_API_KEY: ""
          GROK_API_KEY: ""
          PRECHECK_LIVE: ""
        run: python -m pytest -q --ignore=tests/test_precheck_corpus.py
